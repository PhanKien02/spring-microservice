spring:
  application:
        name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/user_store
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: root_password
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
server:
  port: 8081
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka